services:
  cycle:
    image: ghcr.io/dermute/cycle:latest
    container_name: cycle
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/api/periods || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cycle-data:
