services:
  cycle:
    image: ghcr.io/dermute/cycle:latest
    container_name: cycle
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/periods"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cycle-data:
